[pytest]
testpaths = tests
pythonpath = .

# --env is defined in conftest.py (default: qa). Override with: pytest --env=staging
addopts =
    -ra
    --strict-markers
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=reports/artifacts
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast, critical-path checks run on every commit
    regression: full regression coverage
    ui: browser tests (auto-applied to tests/ui)
    api: API tests (auto-applied to tests/api)

log_file = reports/test.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
